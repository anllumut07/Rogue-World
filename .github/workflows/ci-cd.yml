name: CI/CD Pipeline

on:
  push:
    branches: [gece-calisma, main]
  pull_request:
    branches: [gece-calisma, main]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: false
        type: choice
        options:
          - 'beta'
          - 'release'
        default: 'beta'

env:
  GODOT_VERSION: "4.7.2"
  GODOT_EXECUTABLE: "C:/Proje/Rogue-World/Godot_v4.7.2-stable_mono_win64/Godot_v4.7.2-stable_mono_win64_console.exe"
  PROJECT_PATH: "C:/Proje/Rogue-World"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ${{ env.PROJECT_PATH }}

      - name: Build project
        run: dotnet build --configuration Release
        working-directory: ${{ env.PROJECT_PATH }}

      - name: Run headless import
        run: |
          & "${{ env.GODOT_EXECUTABLE }}" --headless --path "${{ env.PROJECT_PATH }}" --import
        shell: pwsh

      - name: Run all tests
        run: |
          $tests = @(
            "--save-load-test",
            "--balance-test",
            "--ai-nuclear-test",
            "--space-test",
            "--war-test=POL --country=GER",
            "--focus-test=GER",
            "--screenshot-test",
            "--scenario-test",
            "--espionage-mission-test",
            "--occupation-test",
            "--civil-war-test",
            "--recognition-test",
            "--advisor-test"
          )

          foreach ($test in $tests) {
            Write-Host "=== Running $test ==="
            $result = powershell -File tools/run-test.ps1 $test
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              Write-Error "Test $test failed with exit code $exitCode"
              exit $exitCode
            }
          }
          Write-Host "All tests passed!"
        working-directory: ${{ env.PROJECT_PATH }}
        shell: pwsh

  export-windows:
    name: Export Windows
    needs: build-and-test
    runs-on: windows-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && (github.ref == 'refs/heads/gece-calisma' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ${{ env.PROJECT_PATH }}

      - name: Build project
        run: dotnet build --configuration Release
        working-directory: ${{ env.PROJECT_PATH }}

      - name: Run headless import
        run: |
          & "${{ env.GODOT_EXECUTABLE }}" --headless --path "${{ env.PROJECT_PATH }}" --import
        shell: pwsh

      - name: Export Windows build
        run: |
          & "${{ env.GODOT_EXECUTABLE }}" --headless --path "${{ env.PROJECT_PATH }}" --export-release "Windows Desktop" "${{ env.PROJECT_PATH }}/../../RogueBuild/RogueWorld.exe"
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rogue-world-windows
          path: |
            ../../RogueBuild/RogueWorld.exe
            ../../RogueBuild/*.pck
          retention-days: 30

  export-linux:
    name: Export Linux
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && (github.ref == 'refs/heads/gece-calisma' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Godot 4.7.2 Mono
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux.x86_64.tar.xz
          tar -xf Godot_v4.7.2-stable_mono_linux.x86_64.tar.xz
          chmod +x Godot_v4.7.2-stable_mono_linux.x86_64
          sudo apt-get update && sudo apt-get install -y mono-complete

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ${{ env.PROJECT_PATH }}

      - name: Build project
        run: dotnet build --configuration Release
        working-directory: ${{ env.PROJECT_PATH }}

      - name: Run headless import
        run: |
          ./Godot_v4.7.2-stable_mono_linux.x86_64 --headless --path "${{ env.PROJECT_PATH }}" --import

      - name: Export Linux build
        run: |
          ./Godot_v4.7.2-stable_mono_linux.x86_64 --headless --path "${{ env.PROJECT_PATH }}" --export-release "Linux/X11" "${{ env.PROJECT_PATH }}/../../RogueBuild/RogueWorld.x86_64"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: rogue-world-linux
          path: |
            ../../RogueBuild/RogueWorld.x86_64
            ../../RogueBuild/*.pck
          retention-days: 30

  export-macos:
    name: Export macOS
    needs: build-and-test
    runs-on: macos-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && (github.ref == 'refs/heads/gece-calisma' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Godot 4.7.2 Mono
        run: |
          brew install --cask godot@4.7.2
          # Or download manually if not available via brew

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ${{ env.PROJECT_PATH }}

      - name: Build project
        run: dotnet build --configuration Release
        working-directory: ${{ env.PROJECT_PATH }}

      - name: Run headless import
        run: |
          /Applications/Godot_mono.app/Contents/MacOS/Godot --headless --path "${{ env.PROJECT_PATH }}" --import

      - name: Export macOS build
        run: |
          /Applications/Godot_mono.app/Contents/MacOS/Godot --headless --path "${{ env.PROJECT_PATH }}" --export-release "macOS" "${{ env.PROJECT_PATH }}/../../RogueBuild/RogueWorld.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: rogue-world-macos
          path: |
            ../../RogueBuild/RogueWorld.zip
          retention-days: 30

  create-release:
    name: Create Release
    needs: [export-windows, export-linux, export-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: rogue-world-windows
          path: artifacts/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: rogue-world-linux
          path: artifacts/linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: rogue-world-macos
          path: artifacts/macos

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "Rogue World v${{ github.run_number }}"
          body_path: RELEASE_NOTES_v1.0-beta.md
          files: |
            artifacts/windows/RogueWorld.exe
            artifacts/windows/*.pck
            artifacts/linux/RogueWorld.x86_64
            artifacts/linux/*.pck
            artifacts/macos/RogueWorld.zip
          draft: false
          prerelease: true